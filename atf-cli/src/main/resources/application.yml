spring:
  main:
    web-application-type: none
    banner-mode: "off"

atf:
  llm:
    # Default provider: ollama (local, free). Override per run with --llm.
    provider: ollama
    temperature: 0.2
    max-retries: 3
    retry-backoff-millis: 2000
    ollama:
      base-url: http://localhost:11434
      model: llama3.1
      timeout: 5m
    openai:
      # Only registered when the key is present.
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      timeout: 3m
  validation:
    max-fix-attempts: 2
    prefer-docker: true
    maven-image: maven:3.9-eclipse-temurin-17
    gradle-image: gradle:8.10-jdk17
    timeout: 15m
    cache-dir: ${user.home}/.autotestforge/cache
  context:
    # Disabled by default. Enable and add stdio MCP servers to enrich prompts with
    # business rules, requirements and TMS test cases.
    enabled: false
    sources:
      # Example:
      # - name: confluence
      #   enabled: true
      #   command: npx
      #   args: ["-y", "@your-org/confluence-mcp-server"]
      #   tool-name: search
      #   query-argument: query
      #   query-template: "Find requirements and business rules for ${fullyQualifiedName}. Methods: ${methods}"
      #   timeout: 30s
      #   max-chars: 8000
      # - name: zephyr
      #   enabled: true
      #   command: npx
      #   args: ["-y", "@your-org/zephyr-mcp-server"]
      #   tool-name: search_tests
      #   query-argument: query
      #   query-template: "Find Zephyr test cases related to ${fullyQualifiedName}"
      #   timeout: 30s
      #   max-chars: 8000

logging:
  level:
    root: info
    com.autotestforge: info
    org.testcontainers: warn
    com.github.dockerjava: warn
