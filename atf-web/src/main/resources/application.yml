server:
  port: 8080

spring:
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-request-size: 50MB

# All AutoTestForge knobs live under atf.* - see atf-defaults.properties in atf-spring
# (or the README) for every key and its default. Override anything here, through
# environment variables (ATF_LLM_PROVIDER=openai) or flags (--atf.llm.provider=openai).
atf:
  llm:
    provider: ollama
  context:
    # Static stdio MCP servers that enrich prompts with business rules, requirements
    # and TMS test cases. Sources added in the web form work without this section.
    enabled: false
    sources:
      # - name: confluence
      #   enabled: true
      #   command: npx
      #   args: ["-y", "@your-org/confluence-mcp-server"]
      #   tool-name: search
      #   query-argument: query
      #   query-template: "Find requirements and business rules for ${fullyQualifiedName}. Methods: ${methods}"
      #   timeout: 30s
      #   max-chars: 8000

logging:
  level:
    root: info
    com.autotestforge: info
    org.testcontainers: warn
    com.github.dockerjava: warn
