<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoTestForge</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 960px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #2f81f7, #a371f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin-top: .4rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin: .8rem 0 .3rem; }
  input[type=text], select, textarea {
    width: 100%;
    padding: .55rem .7rem;
    background: #0d1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
  }
  input[type=text]:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 200px; }
  .checks { display: flex; gap: 1.5rem; margin-top: 1rem; align-items: center; }
  .checks label { display: flex; align-items: center; gap: .4rem; margin: 0; cursor: pointer; }
  button {
    margin-top: 1.2rem;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: .65rem 1.6rem;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .status-RUNNING { color: var(--yellow); }
  .status-COMPLETED { color: var(--green); }
  .status-FAILED { color: var(--red); }
  #events {
    font-family: Consolas, monospace;
    font-size: .82rem;
    color: var(--muted);
    max-height: 220px;
    overflow-y: auto;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem;
    margin-top: 1rem;
    white-space: pre-wrap;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .85rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.mono { font-family: Consolas, monospace; font-size: .8rem; }
  .ok { color: var(--green); }
  .bad { color: var(--red); }
  .hidden { display: none; }
  .summary { margin-top: 1rem; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AutoTestForge</h1>
    <p>AI-powered unit &amp; integration test generator for Java projects</p>
  </header>

  <div class="card">
    <label for="projectPath">Project path (on this machine)</label>
    <input type="text" id="projectPath" placeholder="C:\projects\my-service or /home/me/my-service">
    <div class="row">
      <div>
        <label for="classes">Classes filter (optional, comma-separated)</label>
        <input type="text" id="classes" placeholder="OrderService, com.acme.PriceCalculator">
      </div>
      <div>
        <label for="llm">LLM provider</label>
        <select id="llm">
          <option value="">default (configured)</option>
          <option value="ollama">ollama (local)</option>
          <option value="openai">openai</option>
          <option value="offline">offline (no LLM)</option>
        </select>
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="validate"> Validate in sandbox &amp; self-correct</label>
      <label><input type="checkbox" id="dryRun"> Dry run</label>
      <label><input type="checkbox" id="context"> External MCP context</label>
    </div>
    <div class="row">
      <div>
        <label for="contextSources">MCP context sources (optional, comma-separated)</label>
        <input type="text" id="contextSources" placeholder="confluence, zephyr">
      </div>
      <div>
        <label for="contextQuery">MCP search query template (optional)</label>
        <textarea id="contextQuery" placeholder="Find requirements and TMS tests for ${fullyQualifiedName}. Methods: ${methods}"></textarea>
      </div>
    </div>
    <button id="startBtn" onclick="start()">Generate tests</button>
  </div>

  <div class="card hidden" id="jobCard">
    <h3>Job <span id="jobState" class="status-RUNNING">RUNNING</span></h3>
    <div id="events"></div>
    <div id="resultBlock" class="hidden">
      <table>
        <thead>
        <tr><th>Class</th><th>Status</th><th>LLM calls</th><th>Details</th></tr>
        </thead>
        <tbody id="resultRows"></tbody>
      </table>
      <p class="summary" id="summary"></p>
    </div>
  </div>
</div>

<script>
  let pollTimer = null;

  async function start() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    const body = {
      projectPath: document.getElementById('projectPath').value.trim(),
      classes: document.getElementById('classes').value.split(',').map(s => s.trim()).filter(Boolean),
      llm: document.getElementById('llm').value || null,
      validate: document.getElementById('validate').checked,
      dryRun: document.getElementById('dryRun').checked,
      context: document.getElementById('context').checked,
      contextSources: document.getElementById('contextSources').value.split(',').map(s => s.trim()).filter(Boolean),
      contextQuery: document.getElementById('contextQuery').value.trim() || null
    };
    try {
      const response = await fetch('/api/generation', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        const problem = await response.json().catch(() => ({}));
        alert('Failed to start: ' + (problem.detail || response.status));
        btn.disabled = false;
        return;
      }
      const job = await response.json();
      document.getElementById('jobCard').classList.remove('hidden');
      document.getElementById('resultBlock').classList.add('hidden');
      poll(job.id);
    } catch (e) {
      alert('Request failed: ' + e);
      btn.disabled = false;
    }
  }

  function poll(id) {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      const response = await fetch('/api/generation/' + id);
      if (!response.ok) return;
      const job = await response.json();
      render(job);
      if (job.state !== 'RUNNING') {
        clearInterval(pollTimer);
        document.getElementById('startBtn').disabled = false;
      }
    }, 1500);
  }

  function render(job) {
    const state = document.getElementById('jobState');
    state.textContent = job.state;
    state.className = 'status-' + job.state;

    const events = document.getElementById('events');
    events.textContent = job.events.join('\n') + (job.error ? '\nERROR: ' + job.error : '');
    events.scrollTop = events.scrollHeight;

    if (job.results.length > 0 || job.state !== 'RUNNING') {
      document.getElementById('resultBlock').classList.remove('hidden');
      const rows = document.getElementById('resultRows');
      rows.innerHTML = '';
      for (const r of job.results) {
        const ok = !['FAILED', 'VALIDATION_FAILED'].includes(r.status);
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="mono">' + escapeHtml(r.classFqn) + '</td>' +
          '<td class="' + (ok ? 'ok' : 'bad') + '">' + r.status + '</td>' +
          '<td>' + r.llmAttempts + '</td>' +
          '<td class="mono">' + escapeHtml(r.errorMessage || r.writtenPath || '-') + '</td>';
        rows.appendChild(tr);
      }
      document.getElementById('summary').textContent = job.summary || '';
    }
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : value;
    return div.innerHTML;
  }
</script>
</body>
</html>
