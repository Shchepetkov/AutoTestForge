# Default AutoTestForge settings. Every key can be overridden in the application's
# application.yml, through environment variables (ATF_LLM_PROVIDER=...) or with
# command-line flags (--atf.llm.provider=...).

# --- LLM ---------------------------------------------------------------------
# Default provider: ollama (local, free). Override per run with --llm / the web form.
atf.llm.provider=ollama
atf.llm.temperature=0.2
atf.llm.max-retries=3
atf.llm.retry-backoff-millis=2000

atf.llm.ollama.base-url=http://localhost:11434
atf.llm.ollama.model=llama3.1
atf.llm.ollama.timeout=5m

# Registered when a key is present, or when base-url points at an OpenAI-compatible
# server that needs no key (LM Studio, vLLM, llama.cpp, Ollama's /v1 endpoint...).
atf.llm.openai.api-key=${OPENAI_API_KEY:}
atf.llm.openai.base-url=${OPENAI_BASE_URL:}
atf.llm.openai.model=gpt-4o-mini
atf.llm.openai.timeout=3m

# Registered when a key is present.
atf.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
atf.llm.anthropic.base-url=
atf.llm.anthropic.model=claude-sonnet-4-5
atf.llm.anthropic.max-tokens=8192
atf.llm.anthropic.timeout=3m

# --- Generation --------------------------------------------------------------
# Classes processed concurrently (LLM calls); sandbox runs are always serialized.
atf.generation.parallelism=1
# Regenerate classes that already have a test (otherwise they are skipped).
atf.generation.overwrite-existing=false

# --- Validation --------------------------------------------------------------
atf.validation.max-fix-attempts=2
atf.validation.prefer-docker=true
atf.validation.maven-image=maven:3.9-eclipse-temurin-17
atf.validation.gradle-image=gradle:8.10-jdk17
atf.validation.timeout=15m
atf.validation.cache-dir=${user.home}/.autotestforge/cache

# --- External context (MCP) --------------------------------------------------
# Static sources (atf.context.sources[...]) are used only when enabled; sources
# added per run in the web UI always work.
atf.context.enabled=false
